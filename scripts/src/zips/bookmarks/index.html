<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>Book<span>marks</span></h1><input id="q" placeholder="Search title, URL or tag..."><select id="sort"><option value="new">Newest</option><option value="az">A-Z</option><option value="vis">Most visited</option></select></header>
<form id="f"><input id="u" placeholder="https://example.com" required><input id="t" placeholder="Title (optional)"><input id="g" placeholder="tags, comma separated"><button class="pri">Add</button></form>
<div id="tags"></div><main id="grid"></main><footer><span id="cnt"></span><button id="imp">Import JSON</button><button id="exp">Export JSON</button><input type="file" id="file" accept=".json" hidden></footer>
<script src="js/data.js"></script><script src="js/app.js"></script></body></html>
